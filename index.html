<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEK 1 Trainer 1</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#18202b;--muted:#647184;--line:#dfe5ec;--accent:#315b96;--support:#fff8df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:auto;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 2px 10px #0000000b}
h1{font-size:2rem;margin:.2em 0}h2{margin:.2em 0 .7em}.muted{color:var(--muted)}button,input{font:inherit}button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:#e9eef5;color:#18202b;margin:5px 6px 5px 0}button.primary{background:var(--accent);color:white}button.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white}
input{width:100%;max-width:520px;padding:12px;border:1px solid #b9c4d1;border-radius:9px;margin:8px 0}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef2f7;font-size:.85rem;margin-right:5px}
.support{background:var(--support)}.math{font-family:"Cambria Math","STIX Two Math",serif;font-size:1.15em}.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .15em}.frac span:first-child{border-bottom:1.5px solid;padding:0 .18em .08em}.frac span:last-child{padding:.08em .18em 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.box{border:2px solid #9caabc;padding:12px;border-radius:10px;min-width:130px;text-align:center;background:white}.selected{outline:3px solid #315b96}.hidden{display:none}.bar{height:7px;background:#e5eaf0;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:#617b9e}.feedback{padding:12px;border-radius:10px;background:#f1f4f8;margin-top:12px}.solution{border-left:4px solid #65758b;padding:10px 14px;margin:10px 0;background:#fff}.tiny{font-size:.82rem}.profile td,.profile th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.profile{border-collapse:collapse;width:100%}
.flow{display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0}.flowStep{border:1px solid var(--line);border-radius:12px;background:white;padding:12px 10px;min-width:135px;flex:1;display:flex;flex-direction:column;gap:4px;text-align:center}.flowStep b{display:inline-grid;place-items:center;width:28px;height:28px;margin:auto;border-radius:50%;background:#e8eef7;color:#315b96}.flowStep span{font-weight:700}.flowStep small{color:var(--muted);line-height:1.3}.arrow{display:grid;place-items:center;font-size:1.5rem;color:#718096}@media(max-width:700px){.arrow{display:none}.flowStep{min-width:46%}}
@media(max-width:600px){main{padding:12px}.card{padding:18px}button{min-height:48px}}
</style></head>
<body><main id="app"></main>
<script>
const topics=[
{id:"var",name:"Variablenverständnis",qs:[
{type:"mc",routine:false,q:'Was bedeutet <span class="math">3x</span>?',opts:["3 + x","3 · x","x · x · x","Die Zahl 3 heißt x"],ans:1,err:["addition","ok","exponent","label"]},
{type:"mc",routine:false,q:'Für <span class="math">x = 4</span> gilt <span class="math">2x + 3 = ?</span>',opts:["9","11","24","2 · 4 · 3"],ans:1},
{type:"match",routine:false,q:"Ordne die Aussage dem passenden Term zu.",prompt:"Das Doppelte einer Zahl, um 5 vermehrt",opts:["2x + 5","2(x + 5)","x + 7","5x + 2"],ans:0},
{type:"mc",routine:false,q:'Können <span class="math">a</span> und <span class="math">b</span> denselben Zahlenwert haben?',opts:["Nein, verschiedene Buchstaben müssen verschiedene Werte haben.","Ja, Variablen können denselben Wert annehmen.","Nur wenn a = 0.","Nur in Gleichungen."],ans:1},
{type:"input",routine:true,q:'Berechne für <span class="math">x = 5</span>: <span class="math">4x − 7</span>.',answers:["13"]},
{type:"input",routine:true,q:'Berechne für <span class="math">a = −2</span>: <span class="math">3a + 8</span>.',answers:["2"]}
]},
{id:"text",name:"Terme aufstellen & interpretieren",qs:[
{type:"match",q:"Welcher Term passt?",prompt:"Von einer Zahl werden 7 abgezogen.",opts:["7 − x","x − 7","7x","x + 7"],ans:1},
{type:"match",q:"Welcher Term passt?",prompt:"Die Hälfte der Summe aus x und 6.",opts:["x/2 + 6","(x + 6)/2","x + 3","2(x + 6)"],ans:1},
{type:"mc",q:'Was beschreibt <span class="math">5 + 3x</span>?',opts:["Das Dreifache der Summe aus 5 und x.","5 vermehrt um das Dreifache von x.","Das Fünffache von 3 + x.","3 vermehrt um das Fünffache von x."],ans:1},
{type:"mc",q:'Ein Rechteck hat Seitenlängen <span class="math">x</span> und <span class="math">x + 3</span>. Welcher Term beschreibt den Umfang?',opts:["x(x + 3)","2x + 3","4x + 6","2x(x + 3)"],ans:2},
{type:"input",routine:true,q:"Stelle einen Term auf: Das Vierfache einer Zahl x, vermindert um 9.",answers:["4x-9","4*x-9"]},
{type:"input",routine:true,q:"Stelle einen Term auf: 8 mehr als das Doppelte von x.",answers:["2x+8","8+2x","2*x+8","8+2*x"]}
]},
{id:"simp",name:"Termumformungen",qs:[
{type:"mc",q:'Welche Terme sind gleichwertig zu <span class="math">3x + 5x</span>?',opts:["8x","8x²","15x","8 + x"],ans:0},
{type:"mc",q:'Warum kann man <span class="math">2x + 3</span> nicht zu <span class="math">5x</span> zusammenfassen?',opts:["Weil x nie 1 sein darf.","Weil nur gleichartige Terme zusammengefasst werden können.","Weil Addition bei Variablen verboten ist.","Weil 2 + 3 nicht 5 ist."],ans:1},
{type:"mc",q:'Vereinfache <span class="math">4a − 2a + 7</span>.',opts:["2a + 7","2a + 5","9a","2a"],ans:0},
{type:"mc",q:'Welche Umformung ist korrekt?',opts:["x + x = x²","x · x = 2x","x + x = 2x","2x + 3 = 5x"],ans:2},
{type:"input",routine:true,q:'Vereinfache: <span class="math">7x + 2x − 4</span>.',answers:["9x-4","-4+9x"]},
{type:"input",routine:true,q:'Vereinfache: <span class="math">5a + 3 − 2a + 4</span>.',answers:["3a+7","7+3a"]}
]},
{id:"dist",name:"Ausmultiplizieren & Ausklammern",qs:[
{type:"mc",q:'Welche Umformung von <span class="math">3(x + 4)</span> ist richtig?',opts:["3x + 4","3x + 12","3x + 7","x + 12"],ans:1,err:["partial","ok","mix","partial"]},
{type:"area",q:"Flächenmodell: Welche Summe beschreibt die Gesamtfläche?",labels:["x","4"],height:"3",opts:["3x + 4","3x + 12","x + 12","12x"],ans:1},
{type:"mc",q:'Klammere vollständig aus: <span class="math">6x + 12</span>.',opts:["6(x + 2)","6(x + 12)","3(x + 4)","2(3x + 12)"],ans:0},
{type:"order",q:'Welche Reihenfolge beschreibt <span class="math">−2(x − 5)</span> korrekt?',opts:["−2 · x und −2 · (−5) → −2x + 10","−2 · x und −5 → −2x − 5","−2x − 10","−2 + x − 5"],ans:0},
{type:"input",routine:true,q:'Multipliziere aus: <span class="math">4(2x + 3)</span>.',answers:["8x+12","12+8x"]},
{type:"input",routine:true,q:'Klammere vollständig aus: <span class="math">10x + 15</span>.',answers:["5(2x+3)","5*(2x+3)"]}
]},
{id:"frac",name:"Bruchrechnen",qs:[
{type:"mc",q:'Welche Zahl ist gleich <span class="frac"><span>3</span><span>4</span></span>?',opts:['<span class="frac"><span>6</span><span>8</span></span>','<span class="frac"><span>4</span><span>5</span></span>','<span class="frac"><span>3</span><span>8</span></span>','<span class="frac"><span>9</span><span>16</span></span>'],ans:0},
{type:"mc",q:'Berechne <span class="frac"><span>1</span><span>3</span></span> + <span class="frac"><span>1</span><span>6</span></span>.',opts:['<span class="frac"><span>2</span><span>9</span></span>','<span class="frac"><span>1</span><span>2</span></span>','<span class="frac"><span>2</span><span>6</span></span>','<span class="frac"><span>1</span><span>9</span></span>'],ans:1},
{type:"mc",q:'Was bedeutet das Multiplizieren mit <span class="frac"><span>1</span><span>2</span></span>?',opts:["Die Zahl verdoppeln.","Die Hälfte der Zahl bestimmen.","1 und 2 addieren.","Immer 2 abziehen."],ans:1},
{type:"mc",q:'Welche Rechnung ist korrekt?',opts:['<span class="frac"><span>2</span><span>3</span></span> · <span class="frac"><span>3</span><span>5</span></span> = <span class="frac"><span>6</span><span>15</span></span>','<span class="frac"><span>2</span><span>3</span></span> + <span class="frac"><span>1</span><span>4</span></span> = <span class="frac"><span>3</span><span>7</span></span>','<span class="frac"><span>1</span><span>2</span></span> : <span class="frac"><span>1</span><span>4</span></span> = <span class="frac"><span>1</span><span>8</span></span>','<span class="frac"><span>3</span><span>4</span></span> − <span class="frac"><span>1</span><span>2</span></span> = <span class="frac"><span>2</span><span>2</span></span>'],ans:0},
{type:"input",routine:true,q:'Berechne und kürze: <span class="frac"><span>2</span><span>5</span></span> + <span class="frac"><span>1</span><span>5</span></span>.',answers:["3/5","0.6","0,6"]},
{type:"input",routine:true,q:'Berechne und kürze: <span class="frac"><span>3</span><span>4</span></span> · <span class="frac"><span>2</span><span>3</span></span>.',answers:["1/2","0.5","0,5","2/4","6/12"]}
]}];

let state={ti:0,qi:0,phase:"diagnosis",weak:{},log:[],supportQueue:[],supportIndex:0,recheck:[],reIndex:0,cycle:1,aid:{},version:"1.2 · 30.09.2026"};
const app=document.getElementById("app");
function norm(s){return (s||"").toLowerCase().replace(/\s+/g,"").replace(/,/g,".").replace(/·/g,"*").replace(/[−–]/g,"-").replace(/^([xyzab])=/,"").replace(/\*/g,"")}
function numericValue(s){
 let z=norm(s);
 if(/^[-+]?\d+(\.\d+)?\/[-+]?\d+(\.\d+)?$/.test(z)){
   let [a,b]=z.split("/").map(Number); if(b!==0)return a/b;
 }
 if(/^[-+]?\d+(\.\d+)?$/.test(z)) return Number(z);
 return null;
}
function eqInput(v,answers){
 let n=norm(v);
 if(answers.some(a=>norm(a)===n)) return true;
 let nv=numericValue(n);
 if(nv!==null){
   return answers.some(a=>{let av=numericValue(a);return av!==null && Math.abs(nv-av)<1e-9});
 }
 return false;
}
function head(label){return `<div class="muted tiny">SEK-I Diagnosetrainer · ${state.version}</div><h1>${label}</h1>`}
function start(){app.innerHTML=`<div class="card">${head("SEK 1 Trainer 1")}
<div style="max-width:650px;margin:18px auto;text-align:center"><div style="font-size:3rem">∑</div><h2>Diagnose · Üben · erneut prüfen</h2><p>Ein klassenübergreifender Mathe-Trainer für die Sekundarstufe I.</p></div>
<p><span class=tag>Klasse 7–10</span><span class=tag>adaptiv</span><span class=tag>interaktiv</span><span class=tag>iPad-tauglich</span></p>
<p class=muted>Während der Diagnose gibt es keine Lösungshinweise. Deine Antworten werden zunächst neutral gespeichert.</p>
<div class=row><button class=primary onclick="renderQ()">Diagnose starten</button><button onclick="toggleInfo()">Aufbau & Hintergrundinformationen</button></div>
<div id=info class=hidden><div class="card" style="margin-top:18px;background:#f8fafc">
<h2>So ist der Trainer aufgebaut</h2>
<div class="flow">
<div class="flowStep"><b>1</b><span>Diagnose</span><small>5 Themen<br>30 Basisaufgaben</small></div><div class="arrow">→</div>
<div class="flowStep"><b>2</b><span>Lernprofil</span><small>sicher · festigen · aufbauen</small></div><div class="arrow">→</div>
<div class="flowStep"><b>3</b><span>Förderung</span><small>nur bei Bedarf<br>2 Aufgaben je Bereich</small></div><div class="arrow">→</div>
<div class="flowStep"><b>4</b><span>Profi-Check</span><small>neue Parallelaufgaben</small></div></div>
<h3>Themengebiete</h3><p>Variablenverständnis · Terme aufstellen & interpretieren · Termumformungen · Ausmultiplizieren & Ausklammern · Bruchrechnen</p>
<h3>Aufgaben und Förderung</h3><p>Jedes Thema enthält <b>4 Verständnis-/Diagnoseaufgaben</b> und <b>2 Routineaufgaben</b>. Auffällige Bereiche werden anschließend gezielt geübt. In der Förderphase stehen <b>Tipp / Hilfe</b> und eine <b>Musterlösung</b> zur Verfügung. Förderaufgaben zählen nicht als diagnostischer Nachweis.</p>
<h3>Bewertung</h3><p>Der Trainer arbeitet nicht mit einer bloßen Gesamtpunktzahl. Die Bereiche werden getrennt betrachtet. Eine falsche Antwort ist zunächst nur ein diagnostischer Hinweis. Nach der Förderung entscheidet ein neuer, hilfefreier Profi-Check darüber, ob ein Bereich als sicher gilt.</p>
<h3>Wenn es noch nicht sicher ist</h3><p>Wer einen Bereich bereits sicher beherrscht, erhält dort keine unnötige Förderung. Bei weiter bestehender Unsicherheit folgt höchstens eine zweite Förderrunde; danach wird weitere Unterstützung durch die Lehrkraft empfohlen.</p>
</div></div></div>`}
function toggleInfo(){document.getElementById("info").classList.toggle("hidden")}
function current(){return topics[state.ti].qs[state.qi]}
function renderQ(){
 if(state.ti>=topics.length)return finishDiagnosis();
 let t=topics[state.ti],q=current(), done=state.ti*6+state.qi;
 app.innerHTML=`<div class="card">${head("Diagnose")}<div class=bar><i style="width:${done/30*100}%"></i></div><p><span class=tag>${t.name}</span>${q.routine?'<span class=tag>Routine</span>':''}</p><h2>${q.q}</h2>${q.prompt?`<p class=box>${q.prompt}</p>`:""}<div id=answer>${answerUI(q)}</div><button onclick="unsure()">Ich bin mir nicht sicher</button><div id=fb></div></div>`;
}
function answerUI(q){
 if(q.type==="input")return `<input id=inp inputmode=text autocomplete=off placeholder="Antwort eingeben"><br><button class=primary onclick="submitInput()">Antwort speichern</button>`;
 if(q.type==="area")return `<div class=row><div class=box style="min-width:240px"><b>Höhe: ${q.height}</b><hr><div class=row><div style="flex:2;border:1px solid;padding:25px">${q.labels[0]}</div><div style="flex:1;border:1px solid;padding:25px">${q.labels[1]}</div></div></div></div>${choices(q)}`;
 return choices(q)
}
function choices(q){return q.opts.map((o,i)=>`<button class=choice onclick="submitChoice(${i})">${o}</button>`).join("")}
function record(ok,answer,uns=false){
 let t=topics[state.ti],q=current();state.log.push({topic:t.id,topicName:t.name,phase:"Diagnose",q:q.q,answer,ok,uns,routine:!!q.routine});
 if(!ok||uns) state.weak[t.id]=(state.weak[t.id]||0)+1;
 document.getElementById("answer").innerHTML="";document.getElementById("fb").innerHTML=`<div class=feedback>Antwort gespeichert.</div><button class=primary onclick="nextQ()">Weiter</button>`;
}
function submitChoice(i){let q=current();record(i===q.ans,q.opts[i])}
function submitInput(){let q=current(),v=document.getElementById("inp").value;if(!v.trim())return;record(eqInput(v,q.answers),v)}
function unsure(){record(false,"Ich bin mir nicht sicher",true)}
function nextQ(){state.qi++;if(state.qi>=topics[state.ti].qs.length){state.ti++;state.qi=0}renderQ()}
function finishDiagnosis(){
 let weak=topics.filter(t=>state.weak[t.id]); if(!weak.length)return finalScreen();
 state.supportQueue=weak.map(t=>t.id);state.supportIndex=0;
 app.innerHTML=`<div class="card">${head("Dein erstes Lernprofil")}<p>Die Diagnose ist abgeschlossen. In ${weak.length} Bereich${weak.length>1?"en":""} lohnt sich jetzt gezieltes Üben.</p>${profileTable()}<div class="support card"><h2>Jetzt wird geübt</h2><p>Nur die auffälligen Bereiche werden trainiert. Die beiden Förderaufgaben steigen im Niveau.</p><button class=primary onclick="supportStart()">Förderung starten</button></div></div>`;
}
function profileTable(){return `<table class=profile><tr><th>Bereich</th><th>Status</th></tr>${topics.map(t=>`<tr><td>${t.name}</td><td>${state.weak[t.id]?"noch festigen":"sicher"}</td></tr>`).join("")}</table>`}
const support={
var:[{q:"Ziehe gedanklich eine Zahl in die Variable ein: x = 3. Welche Karte zeigt 2x?",opts:["3 + 2","3 · 2","3²"],ans:1,h:"x steht hier für einen Zahlenwert. 2x bedeutet: 2 mal dieser Wert.",sol:"Setze x = 3 ein: 2x = 2 · 3 = 6. Deshalb passt „3 · 2“."},{q:"Übertrage selbst: Für a = −4, welcher Wert gehört zu 3a + 5?",opts:["−7","−17","17"],ans:0,h:"Ersetze zuerst a durch −4. Achte auf das Vorzeichen.",sol:"3a + 5 = 3 · (−4) + 5 = −12 + 5 = −7."}],
text:[{q:"Ordne zu: „Das Dreifache einer Zahl, vermehrt um 4“",opts:["3x + 4","3(x + 4)","x + 7"],ans:0,h:"Zuerst wird die Zahl verdreifacht; danach kommen 4 dazu.",sol:"Das Dreifache von x ist 3x. „vermehrt um 4“ ergibt 3x + 4."},{q:"Welche Übersetzung ist korrekt: „7 weniger als das Doppelte von x“?",opts:["7 − 2x","2x − 7","2(x − 7)"],ans:1,h:"Beginne mit dem Doppelten von x.",sol:"Das Doppelte ist 2x. Davon werden 7 abgezogen: 2x − 7."}],
simp:[{q:"Sortiere gedanklich nach gleichartigen Teilen: 4x + 3x + 2. Was lässt sich zusammenfassen?",opts:["4x und 3x","3x und 2","alles zu 9x"],ans:0,h:"Nur Terme mit demselben Variablenteil sind gleichartig.",sol:"4x und 3x haben beide den Variablenteil x. Daher 4x + 3x = 7x; die 2 bleibt: 7x + 2."},{q:"Vereinfache nun selbst: 6a − 2 + 3a + 5.",opts:["9a + 3","9a + 7","7a + 3"],ans:0,h:"Fasse a-Terme und Zahlen jeweils getrennt zusammen.",sol:"6a + 3a = 9a und −2 + 5 = 3. Ergebnis: 9a + 3."}],
dist:[{q:"Flächenmodell: Ein Rechteck ist 3 hoch und in Breiten x und 4 geteilt. Welche Teilflächen entstehen?",opts:["3x und 12","3x und 4","x und 12"],ans:0,h:"Fläche = Höhe · Breite. Berechne beide Teilrechtecke getrennt.",sol:"Links: 3 · x = 3x. Rechts: 3 · 4 = 12. Gesamt: 3x + 12."},{q:"Übertrage ohne Flächenmodell: −2(x − 6) = ?",opts:["−2x + 12","−2x − 12","−2x − 6"],ans:0,h:"Multipliziere −2 mit beiden Summanden – auch mit −6.",sol:"−2 · x = −2x und −2 · (−6) = +12. Also −2x + 12."}],
frac:[{q:"Anschaulich: Zwei von sechs gleich großen Teilen sind markiert. Welcher Bruch beschreibt denselben Anteil gekürzt?",opts:["1/3","2/3","1/6"],ans:0,h:"Teile Zähler und Nenner durch dieselbe Zahl.",sol:"2/6 lässt sich durch 2 kürzen: (2 : 2)/(6 : 2) = 1/3."},{q:"Übertrage: 2/3 + 1/6 = ?",opts:["3/9","5/6","1/2"],ans:1,h:"Bringe beide Brüche zuerst auf den Nenner 6.",sol:"2/3 = 4/6. Dann 4/6 + 1/6 = 5/6."}]
};
function supportStart(){renderSupport()}
function renderSupport(){
 if(state.supportIndex>=state.supportQueue.length)return transition();
 let id=state.supportQueue[state.supportIndex],t=topics.find(x=>x.id===id),idx=state.aid[id]?.step||0,q=support[id][idx];
 app.innerHTML=`<div class="card support">${head("Förderung")}<p><span class=tag>${t.name}</span><span class=tag>Förderaufgabe ${idx+1} von 2</span></p><h2>${q.q}</h2><div id=answer>${q.opts.map((o,i)=>`<button class=choice onclick="supportAnswer('${id}',${i})">${pretty(o)}</button>`).join("")}</div><div class=row><button onclick="hint('${id}')">Tipp / Hilfe</button><button onclick="solution('${id}')">Musterlösung anzeigen</button></div><div id=fb></div></div>`;
}
function pretty(s){return s.replace(/(\d+)\/(\d+)/g,'<span class="frac"><span>$1</span><span>$2</span></span>')}
function ensureAid(id){if(!state.aid[id])state.aid[id]={step:0,hint:false,solution:false}}
function hint(id){ensureAid(id);state.aid[id].hint=true;let q=support[id][state.aid[id].step];document.getElementById("fb").innerHTML=`<div class=feedback><b>Tipp / Hilfe:</b> ${q.h}</div>`}
function solution(id){ensureAid(id);state.aid[id].solution=true;let q=support[id][state.aid[id].step];document.getElementById("fb").innerHTML=`<div class=solution><b>Musterlösung:</b> ${q.sol}</div>`}
function supportAnswer(id,i){ensureAid(id);let a=state.aid[id],q=support[id][a.step],ok=i===q.ans;state.log.push({topic:id,phase:"Förderung",step:a.step+1,ok,hint:a.hint,solution:a.solution});document.getElementById("answer").innerHTML="";document.getElementById("fb").innerHTML=`<div class=feedback>${ok?"Das passt.":"Noch nicht ganz."} ${ok?"":"Nutze bei Bedarf Tipp/Hilfe oder die Musterlösung."}</div><button class=primary onclick="advanceSupport('${id}')">Weiter</button>`}
function advanceSupport(id){ensureAid(id);if(state.aid[id].step===0){state.aid[id]={step:1,hint:false,solution:false};renderSupport()}else{state.supportIndex++;renderSupport()}}
function transition(){state.recheck=state.supportQueue.slice();state.reIndex=0;app.innerHTML=`<div class=card>${head("Förderung abgeschlossen")}<h2>Bereit für einen erneuten Test?</h2><p>Im Algebra-Profi-Check werden nur die Bereiche geprüft, an denen du gearbeitet hast. Es gibt neue Aufgaben und keine Tipps oder Musterlösungen.</p><button class=primary onclick="renderRe()">Algebra-Profi-Check starten</button></div>`}
const reQ={
var:{q:"Für x = −3: Welchen Wert hat 4x + 5?",opts:["−7","−17","17"],ans:0},
text:{q:"Welcher Term bedeutet: „Das Fünffache einer Zahl, vermindert um 2“?",opts:["5x − 2","5(x − 2)","2 − 5x"],ans:0},
simp:{q:"Vereinfache: 8x − 3x + 4.",opts:["5x + 4","5x","11x + 4"],ans:0},
dist:{q:"Multipliziere aus: 5(x − 3).",opts:["5x − 15","5x − 3","5x + 15"],ans:0},
frac:{q:"Berechne: 1/4 + 1/2.",opts:["2/6","3/4","1/6"],ans:1}
};
function renderRe(){
 if(state.reIndex>=state.recheck.length)return reFinish();
 let id=state.recheck[state.reIndex],t=topics.find(x=>x.id===id),q=reQ[id];
 app.innerHTML=`<div class=card>${head("Algebra-Profi-Check")}<p><span class=tag>${t.name}</span></p><h2>${pretty(q.q)}</h2>${q.opts.map((o,i)=>`<button class=choice onclick="reAnswer('${id}',${i})">${pretty(o)}</button>`).join("")}<button onclick="reAnswer('${id}',-1)">Ich bin mir nicht sicher</button><div id=fb></div></div>`
}
function reAnswer(id,i){let q=reQ[id],ok=i===q.ans;state.log.push({topic:id,phase:"Re-Diagnose",cycle:state.cycle,ok});if(ok)delete state.weak[id];document.querySelectorAll("button").forEach(b=>b.disabled=true);document.getElementById("fb").innerHTML=`<div class=feedback>Antwort gespeichert.</div><button class=primary onclick="nextRe()">Weiter</button>`;document.querySelector("#fb button").disabled=false}
function nextRe(){state.reIndex++;renderRe()}
function reFinish(){
 let still=state.recheck.filter(id=>state.weak[id]);
 if(still.length && state.cycle<2){state.cycle++;state.supportQueue=still;state.supportIndex=0;still.forEach(id=>state.aid[id]={step:0,hint:false,solution:false});app.innerHTML=`<div class=card>${head("Noch einmal gezielt üben")}<p>Einige Bereiche sind noch nicht sicher. Dafür folgt eine zweite kurze Förderrunde mit neuen bzw. strukturgleichen Aufgaben.</p><button class=primary onclick="renderSupport()">Zweite Förderrunde starten</button></div>`}
 else finalScreen()
}
function finalScreen(){
 let allSafe=Object.keys(state.weak).length===0;
 app.innerHTML=`<div class=card>${head("Abschlussprofil")}<h2>${allSafe?"Geschafft!":"Dein aktueller Lernstand"}</h2><p>${allSafe?"Du hast die geprüften Bereiche sicher bearbeitet.":"Einige Bereiche solltest du mit einer Lehrkraft oder mit weiterem Material vertiefen."}</p>${profileTable()}<div class=card><h2>Für Lehrende</h2><button onclick="teacher()">Diagnoseprotokoll anzeigen</button><div id=teacher></div></div><button onclick="location.reload()">Neu beginnen</button></div>`;
}
function teacher(){let rows=state.log.map(x=>`<tr><td>${x.topicName||topics.find(t=>t.id===x.topic)?.name||x.topic}</td><td>${x.phase}</td><td>${x.ok?"sicher/richtig":"auffällig"}</td><td>${x.hint?"Tipp/Hilfe ":""}${x.solution?"Musterlösung":""}</td></tr>`).join("");document.getElementById("teacher").innerHTML=`<p class=muted>Beobachtungen sind diagnostische Hinweise, keine Zuschreibung einer festen Fehlvorstellung.</p><table class=profile><tr><th>Bereich</th><th>Phase</th><th>Beobachtung</th><th>Hilfen</th></tr>${rows}</table>`}
function selfTest(){
 let tests=[
 eqInput("3/5",["0.6"]),eqInput("0,6",["3/5"]),eqInput("0,5",["1/2"]),
 eqInput("2/4",["1/2"]),!eqInput("2/3",["1/2"]),eqInput("8+2x",["2x+8","8+2x"]),
 norm("x=5")==="5",topics.length===5,topics.every(t=>t.qs.length===6),
 Object.keys(support).length===5,Object.keys(reQ).length===5
 ];return tests.every(Boolean)
}
if(!selfTest()) app.innerHTML=`<div class=card><h1>Technischer Selbsttest fehlgeschlagen</h1><p>Der Trainer wurde aus Sicherheitsgründen nicht gestartet.</p></div>`; else start();
</script></body></html>
